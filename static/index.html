<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ผู้ช่วยความรู้กฎหมายเบื้องต้น</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>
</head>
<body>
    <!-- ปุ่มเปิด sidebar (มุมซ้ายบน ลอยอยู่เสมอ) -->
    <button id="sidebarToggle" aria-label="เปิดเมนู" aria-expanded="false" aria-controls="sideMenu">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
    </button>

    <!-- พื้นหลังมืดตอน sidebar เปิด (กดเพื่อปิด) -->
    <div id="sidebarBackdrop" hidden></div>

    <!-- Sidebar -->
    <nav id="sideMenu" aria-hidden="true">
        <div class="side-top">
            <span class="side-brand">ThaiMeSuk</span>
            <button id="sidebarClose" aria-label="ปิดเมนู">✕</button>
        </div>

        <!-- พื้นที่รายการแชท — โครงไว้รองรับการเพิ่ม/ลบในอนาคต ตอนนี้ยังว่างเปล่า -->
        <div class="side-middle">
            <button id="newChatBtn" class="side-new-chat-btn" onclick="startNewChat()">+ แชทใหม่</button>
            <div class="side-section-label">ประวัติแชท</div>
            <ul id="chatHistoryList">
                <li class="side-empty">เข้าสู่ระบบเพื่อบันทึกประวัติแชท</li>
            </ul>
        </div>

        <!-- พื้นที่ผู้ใช้ (login/signup/signout) -->
        <div class="side-bottom" id="userArea">
            <!-- โครง JS จะสลับเนื้อหาส่วนนี้ตามสถานะ login (ดู script.js) -->
        </div>
    </nav>

    <h1 class="page-title">⚖️ กำลังสงสัยกฎหมายอะไรอยู่? ⚖️</h1>

    <div class="ask-row">
        <input type="text" id="questionInput" placeholder="พิมพ์คำถามเกี่ยวกับกฎหมายที่ท่านสงสัย"
               oninput="handleQuestionInputChange()" onclick="handleQuestionInputClick()">
        <div class="ask-controls">
            <button type="button" id="attachImageBtn" onclick="document.getElementById('imageAttachInput').click()" title="ต้องเข้าสู่ระบบก่อนใช้งาน">แนบเอกสารทางกฎหมาย</button>
            <input type="file" id="imageAttachInput" accept="image/jpeg,image/png,image/webp,image/gif" hidden onchange="handleImageSelected()">
            <button onclick="askQuestion()">ถาม</button>
        </div>
    </div>

    <div id="imageAttachPreview" class="image-attach-preview" hidden>
        <span id="imageAttachName"></span>
        <button type="button" onclick="clearImageAttachment()">✕</button>
    </div>

    <div id="loading" style="display:none;">กำลังคิด...</div>
    <div id="answerBox"></div>

    <p class="app-footnote">💡 เครื่องมือช่วยค้นหาความรู้กฎหมายเบื้องต้นเพื่อความสะดวกของท่าน สำหรับกรณีเฉพาะแนะนำปรึกษาทนายความหรือหน่วยงานราชการที่เกี่ยวข้องเพิ่มเติม</p>

    <!-- Modal overlay — ใช้ร่วมกันทั้ง login/register/forgot-password/profile -->
    <div id="modalBackdrop" class="modal-backdrop" hidden>
        <div class="modal-card" id="modalContent" role="dialog" aria-modal="true"></div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
